<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Expenses chart component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section class="balance-card" aria-label="Balance">
        <div>
          <small>My balance</small>
          <div class="amount">$921.48</div>
        </div>

        <img class="logo" src="./images/logo.svg" alt="" />
      </section>

      <section class="card" aria-label="Spending chart">
        <h2>Spending – Last 7 days</h2>

        <div class="chart">
          <div class="bars" id="bars"></div>
        </div>

        <div class="divider"></div>

        <div class="footer">
          <div>
            <small>Total this month</small>
            <div class="total">$478.33</div>
          </div>

          <div class="delta">
            <div class="pct">+2.4%</div>
            <div class="from">from last month</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
